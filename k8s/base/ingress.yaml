apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  labels:
    app.kubernetes.io/name: hello
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  # No host is specified on purpose: the rule matches any Host header, so
  # `curl $(minikube ip)` works without editing /etc/hosts.
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
