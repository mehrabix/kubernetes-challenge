apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hello
  labels:
    app.kubernetes.io/name: hello
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hello
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from the ingress controller namespace only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4000
